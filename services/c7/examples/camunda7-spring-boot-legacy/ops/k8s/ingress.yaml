# MIGRATION HOTSPOT (non-Java config): path-based routing to the webapps (/camunda/app/) and
# the REST API (/engine-rest). If the webapp path changes to /operaton, this ingress, any
# auth proxy rules (oauth2-proxy, WAF) and bookmarks/links in runbooks need to follow.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-fulfillment
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: orders.example.com
      http:
        paths:
          - path: /camunda/app/
            pathType: Prefix
            backend:
              service:
                name: order-fulfillment
                port:
                  number: 8080
          - path: /camunda/api/
            pathType: Prefix
            backend:
              service:
                name: order-fulfillment
                port:
                  number: 8080
          - path: /engine-rest
            pathType: Prefix
            backend:
              service:
                name: order-fulfillment
                port:
                  number: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-fulfillment-env
data:
  CAMUNDA_BPM_ADMIN_USER_ID: admin
  CAMUNDA_BPM_WEBAPP_APPLICATION_PATH: /camunda
  CAMUNDA_BPM_JOB_EXECUTION_ENABLED: "true"
