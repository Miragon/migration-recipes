type: specs.openrewrite.org/v1beta/recipe
name: starterpack.operaton.internal.Jackson3OutsideOperatonCode
displayName: 'Internal: Jackson 2 -> 3 only for Java/Kotlin sources that do not use org.operaton types'
description: >-
  Operaton 2.x Spin (DataFormatConfigurator, JacksonJsonDataFormat#getObjectMapper), the REST API and the
  external task client still use Jackson 2 (com.fasterxml.jackson). Build files are excluded as well, so
  Jackson 2 modules such as jackson-datatype-jsr310 stay available for Spin.
preconditions:
  - org.openrewrite.FindSourceFiles:
      filePattern: '**/*.java;**/*.kt'
  - org.openrewrite.java.search.DoesNotUseType:
      fullyQualifiedTypeName: org.operaton..*
recipeList:
